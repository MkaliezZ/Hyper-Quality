name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-validation.txt
      - run: python tools/verify_public_source.py
      - run: python tools/eval_suite.py --out runtime/product-eval
      - run: python tools/plan_eval_suite.py --out runtime/plan-eval
      - run: python tools/demo.py --out runtime/demo
      - run: python tools/verify_bundle.py runtime/demo/product/task-bundle.json
      - run: python tools/verify_bundle.py runtime/demo/plan/task-bundle.json
